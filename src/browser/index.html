<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pulldash – Fast, Filterable PR Review</title>
    <meta
      name="description"
      content="Fast, filterable PR review. Entirely client-side via GitHub's CORS API."
    />
    <meta property="og:title" content="Pulldash – Fast, Filterable PR Review" />
    <meta
      property="og:description"
      content="Fast, filterable PR review. Entirely client-side via GitHub's CORS API."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pulldash.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Pulldash – Fast, Filterable PR Review"
    />
    <meta
      name="twitter:description"
      content="Fast, filterable PR review. Entirely client-side via GitHub's CORS API."
    />
    <meta name="theme-color" content="#408AC3" />

    <link rel="icon" type="image/svg+xml" href="./logo.svg" />

    <!-- Apply the persisted theme before first paint to avoid a flash of the
         wrong theme. Keep in sync with src/browser/lib/theme.ts -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pulldash_theme");
          if (t !== "light" && t !== "dark" && t !== "system") t = "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <script type="module" src="./index.tsx"></script>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
